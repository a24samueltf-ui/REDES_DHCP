services:

  router:
    build: ./docker/router
    hostname: router
    networks:
      rede_wan:
        ipv4_address: 192.168.200.254  
        interface_name: eth0  
      rede_stark:
        ipv4_address: 192.168.10.254
        interface_name: eth1
      rede_lannister:
        ipv4_address: 192.168.11.254
        interface_name: eth2
      rede_targaryen:
        ipv4_address: 192.168.12.254
    cap_add:
      - NET_ADMIN           
  dnsserver:
    build: ./docker/dnsserver
    hostname: dnsserver
    networks: 
      dhcp_lab:
        ipv4_address: 192.168.130.9  
    volumes:
      - ./dnsserver/named.conf.local:/etc/bind/named.conf.local
      - ./dnsserver/zonas:/var/cache/bind/zonas          
  kea:
    build: ./docker/kea
    container_name: kea
    networks:
      dhcp_lab:
        ipv4_address: 192.168.130.2
    volumes:
      - ./dhcp/kea-dhcp4.conf.json:/etc/kea/kea-dhcp4.conf
  

  
  bran:
    build: ./docker/cliente
    container_name: bran
    networks:
      dhcp_lab:
        ipv4_address: 192.168.10.30
        mac_address: 02:42:ac:11:00:10  # dirección HW fija

    command: >
      sh -c "ip addr flush dev eth0 && dhclient -v eth0 && sleep infinity"
    cap_add:
      - NET_ADMIN  # Permite al contenedor ejecutar dhclient
    depends_on:
      - kea

  cliente2:
    build: ./docker/cliente

    networks:
      dhcp_lab:
        ipv4_address: 192.168.130.222

    command: >
      sh -c "ip addr flush dev eth0 && dhclient -v eth0 && sleep infinity"
    cap_add:
      - NET_ADMIN  # Permite al contenedor ejecutar dhclient
    depends_on:
      - kea

networks:
  rede_stark:
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.10.0/24
  rede_lannister:
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.11.0/24
  rede_targaryen:
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.12.0/24
  rede_wan:
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.200.0/24             